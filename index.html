<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Тетрадь Алгебры: Бесшовная Механика</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=JetBrains+Mono:wght@700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper-bg: #f8fafc;
            --grid-line: rgba(59, 130, 246, 0.22);
            --margin-line: #ef4444;
            --ink-blue: #1d4ed8;
            --ink-faded: rgba(30, 64, 175, 0.52);
            --pixel-border: #0f172a;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: manipulation;
            font-family: 'JetBrains Mono', monospace;
            background-color: #1e293b;
            background-image: radial-gradient(#334155 1px, transparent 1px);
            background-size: 16px 16px;
        }

        .math-font {
            font-family: 'JetBrains Mono', monospace;
        }

        .pixel-font {
            font-family: 'Press Start 2P', monospace;
        }

        /* Рукописный эффект шариковой ручки прямо по клеткам */
        .pen-writing {
            font-family: 'Caveat', cursive;
            letter-spacing: 0.5px;
        }

        /* Настоящий тетрадный лист в синюю клеточку */
        .notebook-page {
            background-color: var(--paper-bg);
            background-image:
                linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
            background-size: 24px 24px;
            position: relative;
            box-shadow: 6px 6px 0px #0f172a;
        }

        /* Левый переплет со скобами */
        .notebook-page::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            width: 10px;
            background: repeating-linear-gradient(
                to bottom,
                #475569 0px,
                #475569 12px,
                transparent 12px,
                transparent 36px
            );
            border-right: 2px solid #94a3b8;
            opacity: 0.45;
            pointer-events: none;
            z-index: 3;
        }

        /* Красная линия полей */
        .notebook-page::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            right: 22px;
            width: 2px;
            background-color: var(--margin-line);
            opacity: 0.75;
            pointer-events: none;
            z-index: 2;
        }

        @media (min-width: 640px) {
            .notebook-page::before {
                right: 48px;
            }
        }

        /* Пиксель-арт кнопки и плашки */
        .pixel-btn {
            border: 2px solid var(--pixel-border);
            box-shadow: 0 3px 0 var(--pixel-border);
            transition: transform 0.08s ease, box-shadow 0.08s ease, background-color 0.12s ease;
        }
        .pixel-btn:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: 0 0px 0 var(--pixel-border);
        }

        .mode-tab {
            border: 2px solid #0f172a;
            box-shadow: 0 3px 0 #0f172a;
            transition: all 0.1s ease;
        }
        .mode-tab.active {
            background-color: #facc15;
            color: #0f172a;
            transform: translateY(2px);
            box-shadow: 0 1px 0 #0f172a;
        }

        /* Цветовые стили для слагаемых в пиксель-арт эстетике */
        .style-pos {
            background-color: #3b82f6;
            border: 3px solid #0f172a;
            box-shadow: 0 5px 0 #0f172a, inset 0 2px 0 rgba(255,255,255,0.35);
            color: #ffffff;
        }
        .style-neg {
            background-color: #ef4444;
            border: 3px solid #0f172a;
            box-shadow: 0 5px 0 #0f172a, inset 0 2px 0 rgba(255,255,255,0.35);
            color: #ffffff;
        }
        .style-zero {
            background-color: #64748b;
            border: 3px solid #0f172a;
            box-shadow: 0 5px 0 #0f172a, inset 0 2px 0 rgba(255,255,255,0.25);
            color: #ffffff;
        }

        /* Общий контейнер слагаемого */
        .term-unit {
            position: relative;
            display: inline-flex;
            align-items: stretch;
            border-radius: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            font-size: clamp(1.1rem, 4.3vw, 1.6rem);
            color: #ffffff;
            touch-action: none;
            transition: transform 0.14s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.14s ease;
            z-index: 20;
        }

        .num-chip {
            padding: 8px 14px;
            border-radius: 7px;
            cursor: grab;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
        }

        .coeff-part {
            padding: 8px 10px 8px 13px;
            border-radius: 7px 0 0 7px;
            cursor: grab;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-right: 2px dashed rgba(15, 23, 42, 0.55);
            position: relative;
            min-height: 44px;
            transition: transform 0.15s ease, filter 0.15s ease;
        }

        .coeff-part:hover {
            filter: brightness(1.1);
        }

        @keyframes pulseReady {
            0%, 100% { background-color: rgba(250, 204, 21, 0); }
            50% { background-color: rgba(250, 204, 21, 0.38); }
        }

        .coeff-ready {
            animation: pulseReady 1.2s infinite ease-in-out;
        }

        .var-part {
            padding: 8px 13px 8px 10px;
            border-radius: 0 7px 7px 0;
            cursor: grab;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            background: rgba(15, 23, 42, 0.22);
        }

        /* Капсула слияния и блок дроби прямо в рабочей строке */
        .active-capsule {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 10px;
            background-color: #fef08a;
            border: 3px solid #0f172a;
            box-shadow: 0 5px 0 #0f172a;
            color: #0f172a;
            font-weight: 800;
            font-size: clamp(1.05rem, 4vw, 1.45rem);
            animation: capsuleJitter 0.9s infinite ease-in-out;
        }

        @keyframes capsuleJitter {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }

        .active-fraction-box {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px 14px;
            border-radius: 10px;
            background-color: #fef08a;
            border: 3px solid #0f172a;
            box-shadow: 0 5px 0 #0f172a;
            color: #0f172a;
            font-weight: 800;
            font-size: clamp(1rem, 3.8vw, 1.35rem);
            line-height: 1.15;
        }

        .fraction-bar {
            width: 100%;
            height: 3px;
            background-color: #0f172a;
            margin: 3px 0;
            border-radius: 2px;
        }

        @media (min-width: 640px) {
            .num-chip { padding: 10px 18px; }
            .coeff-part { padding: 10px 13px 10px 16px; }
            .var-part { padding: 10px 16px 10px 12px; }
        }

        /* Перетаскиваемый клон */
        .dragging-clone {
            position: fixed !important;
            z-index: 9999 !important;
            pointer-events: none !important;
            box-shadow: 0 14px 0 rgba(15, 23, 42, 0.35) !important;
            transform: scale(1.1) rotate(2deg);
            transition: none !important;
        }

        /* Подсветка при наведении для слияния */
        .merge-glow {
            transform: translateY(-3px) scale(1.06);
            box-shadow: 0 0 0 4px #facc15, 0 6px 0 #0f172a !important;
        }

        .incompatible-glow {
            animation: shakeErr 0.3s ease-in-out;
            box-shadow: 0 0 0 4px #f43f5e, 0 5px 0 #0f172a !important;
        }

        @keyframes shakeErr {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        /* Вязкий портал "=" */
        .portal-wrapper {
            position: relative;
            width: 42px;
            height: 98px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        @media (min-width: 640px) {
            .portal-wrapper {
                width: 56px;
                height: 112px;
            }
        }

        /* Тетрадная запись ручкой сверху */
        .notebook-ink-grid {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: baseline;
            column-gap: 8px;
            width: 100%;
            max-width: 540px;
        }

        .ink-step-row {
            color: var(--ink-faded);
            font-size: clamp(1.3rem, 4.6vw, 1.65rem);
            line-height: 24px;
            min-height: 24px;
            transition: color 0.15s ease, transform 0.15s ease;
        }
        .ink-step-row:hover {
            color: var(--ink-blue);
        }

        .ink-current-row {
            color: var(--ink-blue);
            font-size: clamp(1.5rem, 5.2vw, 1.95rem);
            line-height: 24px;
            min-height: 24px;
            font-weight: 700;
        }

        .ink-underline-sim {
            border-bottom: 2px solid #1d4ed8;
            padding-bottom: 1px;
        }

        /* История решений сверху (тетрадные строчки) */
        .history-scroll {
            scrollbar-width: thin;
            scrollbar-color: rgba(30, 64, 175, 0.25) transparent;
        }
        .history-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .history-scroll::-webkit-scrollbar-thumb {
            background-color: rgba(30, 64, 175, 0.25);
            border-radius: 4px;
        }

        /* Плавный подъем при открытом NumPad */
        #equation-stage {
            transition: padding-bottom 0.28s cubic-bezier(0.22, 1, 0.36, 1);
        }

        body.numpad-open #equation-stage {
            padding-bottom: 245px;
        }

        @media (min-height: 760px) {
            body.numpad-open #equation-stage {
                padding-bottom: 210px;
            }
        }

        /* --- СТИЛИ РЕЖИМА РОГАЛИКА (SLAY THE SPIRE) --- */
        .rogue-target-highlight {
            box-shadow: 0 0 0 4px #facc15, 0 6px 0 #0f172a !important;
            transform: scale(1.06);
        }

        .rogue-node {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            border: 3px solid #0f172a;
            box-shadow: 0 4px 0 #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            transition: transform 0.15s ease, filter 0.15s ease;
            position: relative;
            z-index: 10;
        }
        .rogue-node.available {
            cursor: pointer;
            animation: pulseNode 1.2s infinite ease-in-out;
            background-color: #fef08a;
        }
        .rogue-node.completed {
            background-color: #94a3b8;
            opacity: 0.7;
        }
        .rogue-node.locked {
            background-color: #e2e8f0;
            opacity: 0.55;
        }
        @keyframes pulseNode {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.12); }
        }

        @keyframes floatDmg {
            0% { opacity: 1; transform: translateY(0) scale(0.9); }
            100% { opacity: 0; transform: translateY(-34px) scale(1.15); }
        }
        .dmg-popup {
            position: absolute;
            font-weight: 900;
            font-size: 1.35rem;
            pointer-events: none;
            animation: floatDmg 0.85s ease-out forwards;
            z-index: 80;
            text-shadow: 2px 2px 0 #0f172a;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between p-1.5 sm:p-3">

    <!-- Верхняя компактная пиксель-панель уровней и действий -->
    <header class="w-full max-w-4xl flex flex-wrap items-center justify-between gap-1.5 bg-slate-900 px-2.5 sm:px-4 py-2 rounded-xl border-2 border-slate-950 shadow-[0_4px_0_#0f172a] z-30">
        
        <!-- Переключатель режимов (Тренажёр vs Отдельная мини-игра "⚔️ Путь") -->
        <div class="flex items-center gap-1 sm:gap-1.5 overflow-x-auto py-0.5">
            <div id="trainer-tabs" class="flex items-center gap-1 sm:gap-1.5">
                <button onclick="selectMode('lvl1')" id="mode-lvl1" class="mode-tab bg-slate-800 text-slate-200 px-2.5 py-1 rounded-lg font-extrabold text-xs sm:text-sm whitespace-nowrap">
                    1x
                </button>
                <button onclick="selectMode('lvl2')" id="mode-lvl2" class="mode-tab active bg-slate-800 text-slate-200 px-2.5 py-1 rounded-lg font-extrabold text-xs sm:text-sm whitespace-nowrap">
                    2x
                </button>
                <button onclick="selectMode('dec')" id="mode-dec" class="mode-tab bg-slate-800 text-slate-200 px-2.5 py-1 rounded-lg font-extrabold text-xs sm:text-sm whitespace-nowrap">
                    0,5
                </button>
                <button onclick="selectMode('hard')" id="mode-hard" class="mode-tab bg-slate-800 text-slate-200 px-2.5 py-1 rounded-lg font-extrabold text-xs sm:text-sm whitespace-nowrap">
                    ★
                </button>
                <button onclick="openCustomModal()" id="mode-custom" class="mode-tab bg-indigo-600 text-white px-2.5 py-1 rounded-lg font-extrabold text-xs sm:text-sm whitespace-nowrap">
                    + Свой
                </button>
            </div>

            <button onclick="toggleRogueMode()" id="mode-rogue" class="mode-tab bg-rose-600 text-white px-2.5 py-1 rounded-lg font-extrabold text-xs sm:text-sm whitespace-nowrap">
                ⚔️ Путь
            </button>

            <!-- Полоска уровня и перков (видна только внутри мини-игры "⚔️ Путь") -->
            <div id="rogue-top-bar" class="hidden items-center gap-1.5 pl-1">
                <div class="bg-slate-950 border-2 border-slate-700 px-2 py-0.5 rounded-lg flex items-center gap-1.5 text-xs font-black text-amber-300">
                    <span>LVL <span id="rogue-lvl-num">1</span></span>
                    <div class="w-12 sm:w-16 h-2 bg-slate-800 rounded-full overflow-hidden border border-slate-600">
                        <div id="rogue-xp-bar" class="h-full bg-amber-400 transition-all duration-300" style="width: 0%"></div>
                    </div>
                </div>
                <div id="rogue-perks-list" class="flex items-center gap-1"></div>
            </div>
        </div>

        <!-- Счетчик и кнопки управления -->
        <div class="flex items-center gap-1.5 ml-auto">
            <div id="score-badge" class="bg-slate-950 border-2 border-slate-800 px-2.5 py-1 rounded-lg flex items-center gap-1 text-amber-400 font-black text-xs sm:text-sm">
                <span>★</span>
                <span id="score-counter">0</span>
            </div>
            <button onclick="undoStep()" id="undo-btn" disabled class="pixel-btn bg-slate-700 hover:bg-slate-600 disabled:opacity-35 text-white px-2.5 py-1 rounded-lg font-extrabold text-xs sm:text-sm" title="Шаг назад">
                ↩
            </button>
            <button onclick="startNewEquation()" id="refresh-btn" class="pixel-btn bg-emerald-500 hover:bg-emerald-400 text-slate-950 px-2.5 py-1 rounded-lg font-black text-xs sm:text-sm" title="Новый пример">
                ↻
            </button>
        </div>
    </header>

    <!-- ЧИСТЫЙ ТЕТРАДНЫЙ ЛИСТ -->
    <main id="notebook-main" class="w-full max-w-4xl flex-1 my-1.5 sm:my-2 px-1 sm:px-2 flex flex-col overflow-hidden">
        <div class="notebook-page flex-1 rounded-2xl border-[3px] border-slate-900 flex flex-col justify-between p-2.5 sm:p-5 pl-4 sm:pl-7 pr-7 sm:pr-14 overflow-hidden relative">

            <!-- МИНИМАЛИСТИЧНАЯ АРЕНА БОЯ (Видна только в режиме "⚔️ Путь") -->
            <div id="rogue-hud" class="hidden w-full grid grid-cols-3 items-center gap-1.5 sm:gap-3 bg-slate-900 text-white px-2.5 py-1.5 rounded-xl border-[3px] border-slate-950 shadow-[0_4px_0_#0f172a] mb-1 z-30 select-none">
                
                <!-- ЛЕВО: ГЕРОЙ -->
                <div id="rogue-hero-card" class="relative flex items-center gap-2">
                    <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-lg bg-emerald-500/20 border-2 border-emerald-400 flex items-center justify-center text-lg sm:text-xl shrink-0">
                        🧙‍♂️
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-1 text-xs sm:text-sm font-black text-emerald-300">
                            <span>❤️</span>
                            <span id="hero-hp-text">10/10</span>
                            <span id="hero-shield-badge" class="hidden text-sky-300 ml-1">🛡️</span>
                        </div>
                        <div class="w-full max-w-[90px] h-2 bg-slate-950 rounded-full overflow-hidden border border-slate-700 mt-0.5">
                            <div id="hero-hp-bar" class="h-full bg-emerald-500 transition-all duration-300" style="width: 100%"></div>
                        </div>
                    </div>
                </div>

                <!-- ЦЕНТР: ВОЛНА И АКТИВНЫЕ СПОСОБНОСТИ -->
                <div class="flex flex-col items-center justify-center text-center">
                    <div class="text-[10px] sm:text-xs font-black text-slate-400 tracking-wider uppercase">
                        Бой <span id="rogue-wave-num" class="text-amber-300">1</span>
                    </div>
                    <div id="rogue-active-skills" class="flex items-center gap-1.5 mt-0.5">
                        <button onclick="useMagnetSortSkill()" id="skill-magnet-btn" class="hidden pixel-btn bg-indigo-500 hover:bg-indigo-400 disabled:opacity-40 text-white font-black text-[10px] sm:text-xs px-2 py-0.5 rounded-md" title="Сортировка иксов и чисел">
                            🧲 <span id="skill-magnet-cd">Готово</span>
                        </button>
                        <button onclick="useParityScissorsSkill()" id="skill-scissors-btn" class="hidden pixel-btn bg-amber-400 hover:bg-amber-300 disabled:opacity-40 text-slate-950 font-black text-[10px] sm:text-xs px-2 py-0.5 rounded-md" title="Поделить чётное уравнение на 2">
                            ✂️ :2
                        </button>
                    </div>
                </div>

                <!-- ПРАВО: ВРАГ И ЕГО ТАЙМЕР ШАГОВ -->
                <div id="rogue-enemy-card" class="relative flex items-center justify-end gap-2">
                    <div class="flex flex-col items-end">
                        <div class="flex items-center gap-1.5">
                            <span class="bg-amber-400 text-slate-950 border-2 border-slate-950 px-1.5 py-0.5 rounded-md font-black text-xs sm:text-sm flex items-center gap-0.5" title="Через сколько твоих действий враг атакует">
                                ⏳<span id="enemy-timer-text">4</span>
                            </span>
                            <span class="bg-rose-500/20 border border-rose-400 text-rose-300 px-1.5 py-0.5 rounded-md font-black text-xs sm:text-sm" title="Урон врага">
                                <span id="enemy-dmg-text">1</span>🗡️
                            </span>
                        </div>
                    </div>
                    <div id="enemy-avatar" class="w-8 h-8 sm:w-10 sm:h-10 rounded-lg bg-rose-500/20 border-2 border-rose-400 flex items-center justify-center text-lg sm:text-xl shrink-0">
                        👾
                    </div>
                </div>

            </div>

            <!-- ОКНО ВЫБОРА ПЕРКА ПРИ ПОВЫШЕНИИ УРОВНЯ (3 карточки) -->
            <div id="rogue-perk-modal" class="hidden absolute inset-0 bg-slate-950/90 z-50 flex flex-col items-center justify-center p-3 sm:p-5 text-white">
                <div class="text-amber-300 font-black text-base sm:text-xl mb-1">⬆️ НОВЫЙ УРОВЕНЬ!</div>
                <div class="text-slate-300 text-xs sm:text-sm font-bold mb-3">Выбери одно улучшение:</div>
                <div id="rogue-perk-choices" class="w-full max-w-md flex flex-col gap-2.5"></div>
            </div>

            <!-- ОКНО ПОРАЖЕНИЯ В МИНИ-ИГРЕ -->
            <div id="rogue-gameover-modal" class="hidden absolute inset-0 bg-slate-950/90 z-50 flex flex-col items-center justify-center p-4 text-white text-center">
                <div class="text-4xl mb-2">💀</div>
                <div class="text-rose-400 font-black text-lg sm:text-2xl mb-1">ЗАБЕГ ОКОНЧЕН</div>
                <div class="text-slate-300 text-xs sm:text-sm font-bold mb-4">Побеждено врагов: <span id="rogue-final-waves" class="text-amber-300 font-black">0</span></div>
                <button onclick="initRogueRun()" class="pixel-btn bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black px-5 py-2.5 rounded-xl text-sm sm:text-base">
                    Начать заново ↻
                </button>
            </div>

            <!-- РУКОПИСНАЯ ЗАПИСЬ ПРЯМО ПО КЛЕТОЧКАМ СВЕРХУ (Без громоздких плашек) -->
            <div id="history-container" class="history-scroll overflow-y-auto max-h-[42%] sm:max-h-[46%] flex flex-col items-center px-1 pt-1 pb-1 z-10 select-none">
            </div>

            <!-- Тонкая тетрадная линейка-разделитель -->
            <div class="w-full flex items-center justify-center my-0.5 opacity-45 pointer-events-none z-10">
                <div class="h-[1px] flex-1 border-b border-dashed border-blue-400"></div>
            </div>

            <!-- Активная игровая зона (посередине) -->
            <div id="equation-stage" class="flex-1 flex flex-col items-center justify-center relative z-20 my-auto">
                
                <div class="w-full flex items-center justify-center gap-1 sm:gap-3 min-h-[115px] sm:min-h-[130px]">
                    
                    <!-- Левая сторона -->
