    <script>
        /* =========================================================================
           1. АУДИО И ВИЗУАЛЬНЫЕ ЭФФЕКТЫ (WEB AUDIO API)
        ========================================================================= */
        const SoundEngine = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) this.ctx = new AudioContext();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },
            playTone(freq, type, duration, vol = 0.1) {
                try {
                    this.init();
                    if (!this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) {}
            },
            pickup() { this.playTone(340, 'square', 0.06, 0.06); },
            portalSnap() { this.playTone(620, 'triangle', 0.11, 0.1); },
            capsuleLock() { this.playTone(440, 'square', 0.09, 0.08); setTimeout(() => this.playTone(660, 'square', 0.12, 0.08), 70); },
            success() { 
                this.playTone(523.25, 'square', 0.1, 0.1); 
                setTimeout(() => this.playTone(659.25, 'square', 0.1, 0.1), 100);
                setTimeout(() => this.playTone(783.99, 'square', 0.22, 0.1), 200);
            },
            boing() { this.playTone(160, 'sawtooth', 0.15, 0.1); }
        };

        const FX = {
            canvas: null,
            ctx: null,
            particles: [],
            init() {
                if (this.canvas) return;
                this.canvas = document.createElement('canvas');
                this.canvas.style.position = 'fixed';
                this.canvas.style.inset = '0';
                this.canvas.style.pointerEvents = 'none';
                this.canvas.style.zIndex = '99999';
                document.body.appendChild(this.canvas);
                this.ctx = this.canvas.getContext('2d');
                this.resize();
                window.addEventListener('resize', () => this.resize());
                requestAnimationFrame(() => this.loop());
            },
            resize() {
                if (!this.canvas) return;
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            },
            burst(x, y, colors = ['#3b82f6', '#10b981', '#facc15'], count = 16) {
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 2 + Math.random() * 5.5;
                    this.particles.push({
                        x, y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        size: 5 + Math.floor(Math.random() * 5),
                        color: colors[Math.floor(Math.random() * colors.length)],
                        alpha: 1,
                        decay: 0.02 + Math.random() * 0.02
                    });
                }
            },
            loop() {
                if (!this.ctx || !this.canvas) return;
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.16;
                    p.alpha -= p.decay;
                    if (p.alpha <= 0) {
                        this.particles.splice(i, 1);
                        continue;
                    }
                    this.ctx.save();
                    this.ctx.globalAlpha = p.alpha;
                    this.ctx.fillStyle = p.color;
                    // Пиксельные квадратные частицы
                    this.ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
                    this.ctx.restore();
                }
                requestAnimationFrame(() => this.loop());
            }
        };

        /* =========================================================================
           2. СОСТОЯНИЕ ИГРЫ И ПРОЦЕДУРНЫЙ ГЕНЕРАТОР УРОВНЕЙ
        ========================================================================= */
        const State = {
            mode: 'lvl2', // 'lvl1' (1x), 'lvl2' (2x), 'dec' (0,5), 'hard' (★), 'rogue' (⚔️ Путь)
            lastTrainerMode: 'lvl2',
            score: 0,
            left: [],
            right: [],
            history: [],
            solved: false,
            activeOp: null,
            numpadBuffer: '',
            livePreview: null,
            rogue: {
                initialized: false,
                wave: 1,
                level: 1,
                xp: 0,
                xpThresholds: [2, 3, 5, 7, 10, 14],
                heroHp: 10,
                heroMaxHp: 10,
                shield: false,
                enemy: null,
                perks: [],
                firstTransferUsedThisWave: false,
                hadErrorThisWave: false,
                enemyAttackedThisWave: false,
                magnetCd: 0,
                scissorsUsedThisWave: false
            }
        };

        let termIdCounter = 1;
        function generateId() { return 't_' + (termIdCounter++); }

        function createTerm(val, isX) {
            return { id: generateId(), val: Number(val.toFixed(4)), isX };
        }

        function cloneSide(sideArr) {
            return sideArr.map(t => ({ id: t.id, val: t.val, isX: t.isX }));
        }

        function randInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function randNonZero(min, max) {
            let v = 0;
            while (v === 0) v = randInt(min, max);
            return v;
        }

        function selectMode(newMode) {
            State.mode = newMode;
            if (newMode !== 'rogue') {
                State.lastTrainerMode = newMode;
            }
            ['lvl1', 'lvl2', 'dec', 'hard', 'custom'].forEach(m => {
                const btn = document.getElementById('mode-' + m);
                if (btn) btn.classList.toggle('active', m === newMode);
            });

            document.getElementById('trainer-tabs').classList.remove('hidden');
            document.getElementById('rogue-top-bar').classList.add('hidden');
            document.getElementById('rogue-top-bar').classList.remove('flex');
            document.getElementById('score-badge').classList.remove('hidden');
            document.getElementById('refresh-btn').classList.remove('hidden');
            document.getElementById('rogue-hud').classList.add('hidden');
            document.getElementById('rogue-perk-modal').classList.add('hidden');
            document.getElementById('rogue-gameover-modal').classList.add('hidden');

            const rogueBtn = document.getElementById('mode-rogue');
            rogueBtn.classList.remove('active');
            rogueBtn.innerText = '⚔️ Путь';

            startNewEquation();
        }

        function toggleRogueMode() {
            if (State.mode === 'rogue') {
                selectMode(State.lastTrainerMode || 'lvl2');
                return;
            }
            State.mode = 'rogue';
            document.getElementById('trainer-tabs').classList.add('hidden');
            document.getElementById('rogue-top-bar').classList.remove('hidden');
            document.getElementById('rogue-top-bar').classList.add('flex');
            document.getElementById('score-badge').classList.add('hidden');
            document.getElementById('refresh-btn').classList.add('hidden');
            document.getElementById('rogue-hud').classList.remove('hidden');

            const rogueBtn = document.getElementById('mode-rogue');
            rogueBtn.classList.add('active');
            rogueBtn.innerText = '← Тренажёр';

            if (!State.rogue.initialized) {
                initRogueRun();
            } else {
                updateRogueHUD();
                startNewEquation();
            }
        }

        /* =========================================================================
           2.1 СБАЛАНСИРОВАННЫЙ РОГАЛИК (ТАЙМЕР ВРАГА И УМНЫЕ ПЕРКИ)
        ========================================================================= */
        const ALL_PERKS = [
            {
                id: 'boots',
                icon: '👢',
                name: 'Сапоги Переноса',
                desc: 'Первый перенос через «=» в каждом примере не тратит ход ⏳'
            },
            {
                id: 'inertia',
                icon: '⚡',
                name: 'Инерция Ума',
                desc: 'Верный ответ в калькуляторе с 1-й попытки даёт +1⏳ к таймеру врага'
            },
            {
                id: 'small_synth',
                icon: '🔥',
                name: 'Малый Синтез',
                desc: 'Сложение с ответом от −5 до 5 происходит мгновенно без калькулятора'
            },
            {
                id: 'sniper_div',
                icon: '🎯',
                name: 'Снайпер-Делитель',
                desc: 'Деление нацело в финале срабатывает мгновенно без калькулятора'
            },
            {
                id: 'magnet',
                icon: '🧲',
                name: 'Магнит-Сортировка',
                desc: 'Активная кнопка (КД 2 боя): за 1 шаг переносит все X влево, а числа вправо'
            },
            {
                id: 'scissors',
                icon: '✂️',
                name: 'Ножницы Чётности',
                desc: 'Активная кнопка: делит все чётные слагаемые на 2 без траты хода'
            },
            {
                id: 'vamp',
                icon: '🧛',
                name: 'Вампиризм',
                desc: 'Победа над врагом до его первого удара лечит +2 ❤️'
            },
            {
                id: 'shield',
                icon: '🛡️',
                name: 'Щит Отличника',
                desc: 'В начале каждого 2-го боя даёт щит, блокирующий 1 удар или ошибку'
            },
            {
                id: 'heart',
                icon: '❤️',
                name: 'Большое Сердце',
                desc: 'Макс. здоровье +4 ❤️ и полное исцеление прямо сейчас'
            }
        ];

        const ENEMY_ROSTER = [
            { icon: '👾', name: 'Клякса' },
            { icon: '👺', name: 'Гоблин' },
            { icon: '🕷️', name: 'Паук' },
            { icon: '👹', name: 'Огр' },
            { icon: '🤖', name: 'Голем' },
            { icon: '🐉', name: 'Дракон' }
        ];

        function hasPerk(id) {
            return State.rogue.perks.includes(id);
        }

        function initRogueRun() {
            State.rogue = {
                initialized: true,
                wave: 1,
                level: 1,
                xp: 0,
                xpThresholds: [2, 3, 5, 7, 10, 14],
                heroHp: 10,
                heroMaxHp: 10,
                shield: false,
                enemy: null,
                perks: [],
                firstTransferUsedThisWave: false,
                hadErrorThisWave: false,
                enemyAttackedThisWave: false,
                magnetCd: 0,
                scissorsUsedThisWave: false
            };
            document.getElementById('rogue-gameover-modal').classList.add('hidden');
            document.getElementById('rogue-perk-modal').classList.add('hidden');
            setupRogueWave();
            startNewEquation();
        }

        function setupRogueWave() {
            const R = State.rogue;
            const w = R.wave;
            const rosterItem = ENEMY_ROSTER[(w - 1) % ENEMY_ROSTER.length];

            // Баланс таймера и урона по волнам
            let maxTimer = 4;
            let dmg = 1;
            if (w >= 4 && w <= 7) { maxTimer = 4; dmg = 2; }
            else if (w >= 8 && w <= 14) { maxTimer = 3; dmg = 3; }
            else if (w >= 15) { maxTimer = 3; dmg = 4; }

            R.enemy = {
                icon: rosterItem.icon,
                name: rosterItem.name,
                timer: maxTimer,
                maxTimer: maxTimer,
                dmg: dmg
            };

            R.firstTransferUsedThisWave = false;
            R.hadErrorThisWave = false;
            R.enemyAttackedThisWave = false;
            R.scissorsUsedThisWave = false;
            if (R.magnetCd > 0) R.magnetCd--;

            if (hasPerk('shield') && w % 2 === 0) {
                R.shield = true;
            }

            updateRogueHUD();
        }

        function isEquationAllEven() {
            const all = [...State.left, ...State.right];
            if (all.length === 0) return false;
            return all.every(t => Number.isInteger(t.val) && Math.abs(t.val) % 2 === 0 && t.val !== 0);
        }

        function updateRogueHUD() {
            if (State.mode !== 'rogue') return;
            const R = State.rogue;

            document.getElementById('rogue-lvl-num').innerText = R.level;
            const needXp = R.xpThresholds[Math.min(R.level - 1, R.xpThresholds.length - 1)];
            const pctXp = Math.min(100, Math.round((R.xp / needXp) * 100));
            document.getElementById('rogue-xp-bar').style.width = `${pctXp}%`;

            const perksContainer = document.getElementById('rogue-perks-list');
            perksContainer.innerHTML = R.perks.map(pid => {
                const p = ALL_PERKS.find(x => x.id === pid);
                return p ? `<span class="text-xs sm:text-sm bg-slate-800 border border-slate-600 rounded px-1" title="${p.name}: ${p.desc}">${p.icon}</span>` : '';
            }).join('');

            document.getElementById('hero-hp-text').innerText = `${R.heroHp}/${R.heroMaxHp}`;
            document.getElementById('hero-hp-bar').style.width = `${Math.max(0, (R.heroHp / R.heroMaxHp) * 100)}%`;
            const shieldBadge = document.getElementById('hero-shield-badge');
            if (R.shield) shieldBadge.classList.remove('hidden');
            else shieldBadge.classList.add('hidden');

            document.getElementById('rogue-wave-num').innerText = R.wave;

            if (R.enemy) {
                document.getElementById('enemy-avatar').innerText = R.enemy.icon;
                document.getElementById('enemy-timer-text').innerText = R.enemy.timer;
                document.getElementById('enemy-dmg-text').innerText = R.enemy.dmg;
            }

            // Активные кнопки перков
            const magnetBtn = document.getElementById('skill-magnet-btn');
            if (hasPerk('magnet')) {
                magnetBtn.classList.remove('hidden');
                if (R.magnetCd > 0) {
                    magnetBtn.disabled = true;
                    document.getElementById('skill-magnet-cd').innerText = `${R.magnetCd} б.`;
                } else {
                    magnetBtn.disabled = false;
                    document.getElementById('skill-magnet-cd').innerText = 'Сорт';
                }
            } else {
                magnetBtn.classList.add('hidden');
            }

            const scissorsBtn = document.getElementById('skill-scissors-btn');
            if (hasPerk('scissors')) {
                scissorsBtn.classList.remove('hidden');
                scissorsBtn.disabled = R.scissorsUsedThisWave || !isEquationAllEven();
            } else {
                scissorsBtn.classList.add('hidden');
            }
        }

        function spawnFloatingPopup(targetCardId, text, colorClass) {
            const card = document.getElementById(targetCardId);
            if (!card) return;
            const pop = document.createElement('div');
            pop.className = `dmg-popup ${colorClass}`;
            pop.style.left = '35%';
            pop.style.top = '-4px';
            pop.innerText = text;
            card.appendChild(pop);
            setTimeout(() => pop.remove(), 850);
        }

        function damageHero(amount, label = '') {
            const R = State.rogue;
            if (R.shield) {
                R.shield = false;
                spawnFloatingPopup('rogue-hero-card', '🛡️ Блок!', 'text-sky-300');
                updateRogueHUD();
                return false;
            }
            R.heroHp = Math.max(0, R.heroHp - amount);
            spawnFloatingPopup('rogue-hero-card', `-${amount} ❤️ ${label}`, 'text-rose-400');
            updateRogueHUD();

            if (R.heroHp <= 0) {
                document.getElementById('rogue-final-waves').innerText = R.wave - 1;
                setTimeout(() => {
                    document.getElementById('rogue-gameover-modal').classList.remove('hidden');
                }, 450);
                return true;
            }
            return false;
        }

        function tickRogueStep(isTransfer = false) {
            if (State.mode !== 'rogue' || !State.rogue.enemy) return;
            const R = State.rogue;

            // Перк "Сапоги Переноса": первый перенос в бою не тратит таймер
            if (isTransfer && hasPerk('boots') && !R.firstTransferUsedThisWave) {
                R.firstTransferUsedThisWave = true;
                spawnFloatingPopup('rogue-hero-card', '👢 0⏳', 'text-amber-300');
                updateRogueHUD();
                return;
            }

            R.enemy.timer--;
            if (R.enemy.timer <= 0) {
                R.enemyAttackedThisWave = true;
                SoundEngine.boing();
                damageHero(R.enemy.dmg);
                R.enemy.timer = R.enemy.maxTimer;
            }
            updateRogueHUD();
        }

        // Активный навык 1: Магнитная Сортировка
        function useMagnetSortSkill() {
            if (State.mode !== 'rogue' || State.solved || State.activeOp) return;
            const R = State.rogue;
            if (!hasPerk('magnet') || R.magnetCd > 0) return;

            saveUndoSnapshot();
            const newLeft = [];
            const newRight = [];

            State.left.forEach(t => {
                if (t.val === 0 && !t.isX) return;
                if (t.isX) newLeft.push(createTerm(t.val, true));
                else newRight.push(createTerm(-t.val, false));
            });
            State.right.forEach(t => {
                if (t.val === 0 && !t.isX) return;
                if (t.isX) newLeft.push(createTerm(-t.val, true));
                else newRight.push(createTerm(t.val, false));
            });

            if (newLeft.length === 0) newLeft.push(createTerm(0, false));
            if (newRight.length === 0) newRight.push(createTerm(0, false));

            State.left = newLeft;
            State.right = newRight;
            R.magnetCd = 3; // Перезарядка 2 следующих боя
            SoundEngine.portalSnap();
            tickRogueStep(false);
            renderAll();
        }

        // Активный навык 2: Ножницы Чётности
        function useParityScissorsSkill() {
            if (State.mode !== 'rogue' || State.solved || State.activeOp) return;
            const R = State.rogue;
            if (!hasPerk('scissors') || R.scissorsUsedThisWave || !isEquationAllEven()) return;

            saveUndoSnapshot();
            State.left = State.left.map(t => createTerm(t.val / 2, t.isX));
            State.right = State.right.map(t => createTerm(t.val / 2, t.isX));
            R.scissorsUsedThisWave = true;
            SoundEngine.success();
            spawnFloatingPopup('rogue-hero-card', '✂️ :2', 'text-amber-300');
            updateRogueHUD();
            renderAll();
        }

        function handleRogueWaveVictory() {
            const R = State.rogue;
            spawnFloatingPopup('rogue-enemy-card', '💥 Повержен!', 'text-amber-300');

            if (hasPerk('vamp') && !R.enemyAttackedThisWave) {
                R.heroHp = Math.min(R.heroMaxHp, R.heroHp + 2);
                spawnFloatingPopup('rogue-hero-card', '🧛 +2 ❤️', 'text-emerald-400');
            }

            // Начисление опыта: +1 за победу, и ещё +1 за чистую победу без ошибок и ударов
            const gainedXp = (!R.hadErrorThisWave && !R.enemyAttackedThisWave) ? 2 : 1;
            R.xp += gainedXp;
            R.wave++;

            const needXp = R.xpThresholds[Math.min(R.level - 1, R.xpThresholds.length - 1)];
            if (R.xp >= needXp && R.perks.length < ALL_PERKS.length) {
                R.xp -= needXp;
                R.level++;
                updateRogueHUD();
                setTimeout(() => openPerkSelectionModal(), 480);
            } else {
                setTimeout(() => {
                    setupRogueWave();
                    startNewEquation();
                }, 650);
            }
        }

        function openPerkSelectionModal() {
            const R = State.rogue;
            const available = ALL_PERKS.filter(p => !R.perks.includes(p.id));
            if (available.length === 0) {
                setupRogueWave();
                startNewEquation();
                return;
            }

            const shuffled = [...available].sort(() => Math.random() - 0.5).slice(0, 3);
            const container = document.getElementById('rogue-perk-choices');
            container.innerHTML = '';

            shuffled.forEach(perk => {
                const btn = document.createElement('button');
                btn.className = 'pixel-btn w-full bg-slate-800 hover:bg-slate-700 text-left p-3 rounded-xl flex items-center gap-3';
                btn.innerHTML = `
                    <div class="w-11 h-11 rounded-lg bg-slate-900 border-2 border-amber-400 flex items-center justify-center text-2xl shrink-0">${perk.icon}</div>
                    <div>
                        <div class="font-black text-amber-300 text-sm sm:text-base">${perk.name}</div>
                        <div class="text-xs text-slate-300 font-bold leading-snug">${perk.desc}</div>
                    </div>
                `;
                btn.onclick = () => {
                    if (perk.id === 'heart') {
                        R.heroMaxHp += 4;
                        R.heroHp = R.heroMaxHp;
                    } else {
                        R.perks.push(perk.id);
                    }
                    document.getElementById('rogue-perk-modal').classList.add('hidden');
                    SoundEngine.success();
                    setupRogueWave();
                    startNewEquation();
                };
                container.appendChild(btn);
            });

            document.getElementById('rogue-perk-modal').classList.remove('hidden');
        }

        function buildRogueEquation() {
            const w = State.rogue.wave;
            if (w <= 3) {
                return buildEquationByMode('lvl1');
            } else if (w <= 7) {
                return buildEquationByMode('lvl2');
            } else if (w <= 12) {
                return Math.random() < 0.65 ? buildEquationByMode('hard') : buildEquationByMode('lvl2');
            } else {
                return Math.random() < 0.4 ? buildEquationByMode('dec') : buildEquationByMode('hard');
            }
        }

        function buildEquationByMode(mode) {
            if (mode === 'rogue') {
                return buildRogueEquation();
            }
            if (mode === 'lvl1') {
                // Простые: ax + b = c
                const x = randNonZero(-9, 9);
                const a = randNonZero(2, 6) * (Math.random() < 0.25 ? -1 : 1);
                const b = randNonZero(-15, 15);
                const c = a * x + b;
                if (Math.random() < 0.5) {
                    return { left: [createTerm(a, true), createTerm(b, false)], right: [createTerm(c, false)] };
                } else {
                    return { left: [createTerm(c, false)], right: [createTerm(a, true), createTerm(b, false)] };
                }
            }

            if (mode === 'dec') {
                // Десятичные дроби: корень с половинкой или дробные коэффициенты
                const roots = [-4.5, -3.5, -2.5, -1.5, -0.5, 0.5, 1.5, 2.5, 3.5, 4.5, 1.2, 2.4];
                const x = roots[Math.floor(Math.random() * roots.length)];
                const a = randInt(2, 5);
                const c = randInt(1, 3) * (Math.random() < 0.5 ? 1 : -1);
                const netA = a - c === 0 ? 2 : a - c;
                const b = randNonZero(-8, 8);
                const d = Number(((a - c) * x + b).toFixed(2));
                return {
                    left: [createTerm(a, true), createTerm(b, false)],
                    right: [createTerm(c, true), createTerm(d, false)]
                };
            }

            if (mode === 'hard') {
                // Сложные: по 3 слагаемых, нужно и приводить подобные, и переносить
                const x = randNonZero(-7, 7);
                const a1 = randNonZero(-4, 5);
                const a2 = randNonZero(-3, 4);
                const b1 = randNonZero(-12, 12);
                const c1 = randNonZero(-4, 4);
                // Гарантируем, что иксы не сократятся в 0
                const safeC1 = (a1 + a2 === c1) ? c1 + 2 : c1;
                const b2 = randNonZero(-10, 10);
                const d = (a1 + a2) * x + b1 - safeC1 * x - b2;
                return {
                    left: [createTerm(a1, true), createTerm(b1, false), createTerm(a2, true)],
                    right: [createTerm(safeC1, true), createTerm(b2, false), createTerm(d, false)].filter(t => t.val !== 0)
                };
            }

            // По умолчанию 'lvl2': иксы с двух сторон ax + b = cx + d
            const x = randNonZero(-8, 8);
            const a = randNonZero(-5, 6);
            let c = randNonZero(-4, 5);
            if (a === c) c += (c >= 0 ? 1 : -1);
            const b = randNonZero(-14, 14);
            const d = (a - c) * x + b;
            return {
                left: [createTerm(a, true), createTerm(b, false)],
                right: [createTerm(c, true), createTerm(d, false)]
            };
        }

        function saveUndoSnapshot() {
            State.history.push({
                left: cloneSide(State.left),
                right: cloneSide(State.right)
            });
            document.getElementById('undo-btn').disabled = false;
        }

        function undoStep() {
            if (State.history.length === 0) return;
            if (State.activeOp) {
                cancelActiveOperation();
                return;
            }
            const prev = State.history.pop();
            State.left = prev.left;
            State.right = prev.right;
            State.solved = false;
            document.getElementById('win-banner').classList.add('hidden');
            if (State.history.length === 0) {
                document.getElementById('undo-btn').disabled = true;
            }
            renderAll();
        }

        function startNewEquation() {
            const gen = buildEquationByMode(State.mode === 'custom' ? 'lvl2' : State.mode);
            State.left = cloneSide(gen.left);
            State.right = cloneSide(gen.right);
            State.history = [];
            State.solved = false;
            State.activeOp = null;
            State.livePreview = null;
            document.getElementById('undo-btn').disabled = true;
            document.getElementById('win-banner').classList.add('hidden');
            closeNumpadDrawer();
            updateRogueHUD();
            renderAll();
        }

        /* =========================================================================
           3. ФОРМАТИРОВАНИЕ И ЖИВАЯ РУКОПИСНАЯ ТЕТРАДЬ (БЕЗ РАМОК)
        ========================================================================= */
        function formatRuNum(num) {
            return Number(num.toFixed(4)).toString().replace('.', ',');
        }

        function formatHistoryTerm(val, isX, isFirst) {
            if (val === 0 && !isX) return isFirst ? '0' : '+ 0';
            let sign = '';
            if (val < 0) {
                sign = isFirst ? '−' : '− ';
            } else {
                sign = isFirst ? '' : '+ ';
            }
            let absNum = Math.abs(val);
            let numStr = (isX && absNum === 1) ? '' : formatRuNum(absNum);
            let varStr = isX ? 'x' : '';
            return `${sign}${numStr}${varStr}`;
        }

        function renderSideToHTML(sideArr, highlightIds = []) {
            if (!Array.isArray(sideArr) || sideArr.length === 0) return '0';
            return sideArr.map((t, idx) => {
                const str = formatHistoryTerm(t.val, t.isX, idx === 0);
                if (highlightIds.includes(t.id)) {
                    return `<span class="ink-underline-sim">${str}</span>`;
                }
                return str;
            }).join(' ');
        }

        function isReadyForDivision() {
            if (State.left.length === 1 && State.right.length === 1) {
                const l = State.left[0];
                const r = State.right[0];
                if (l.isX && !r.isX) return { xSide: 'left', numSide: 'right', xTerm: l, numTerm: r };
                if (!l.isX && r.isX) return { xSide: 'right', numSide: 'left', xTerm: r, numTerm: l };
            }
            return null;
        }

        function checkWinCondition() {
            if (State.solved) return;
            if (State.left.length === 1 && State.right.length === 1) {
                const l = State.left[0];
                const r = State.right[0];
                if (l.isX && !r.isX && l.val === 1) {
                    finishEquation(r.val);
                } else if (!l.isX && r.isX && r.val === 1) {
                    finishEquation(l.val);
                }
            }
        }

        function finishEquation(rootVal = 0) {
            State.solved = true;
            State.score++;
            document.getElementById('score-counter').innerText = State.score;
            SoundEngine.success();
            FX.burst(window.innerWidth / 2, window.innerHeight / 2, ['#3b82f6', '#10b981', '#facc15', '#ec4899'], 36);

            if (State.mode === 'rogue') {
                handleRogueWaveVictory();
                return;
            }

            document.getElementById('win-banner').classList.remove('hidden');
        }

        /* Рендер тетрадной записи сверху прямо по клеточкам */
        function renderNotebookTopSection() {
            const container = document.getElementById('history-container');
            container.innerHTML = '';

            // 1. Предыдущие шаги (написанные ручкой строчки, выровненные по знаку "=")
            State.history.forEach((step, idx) => {
                const row = document.createElement('div');
                row.className = 'notebook-ink-grid pen-writing ink-step-row cursor-pointer';
                row.title = 'Вернуться к этой строчке';
                row.onclick = () => {
                    if (State.activeOp) closeNumpadDrawer();
                    State.activeOp = null;
                    State.left = cloneSide(step.left);
                    State.right = cloneSide(step.right);
                    State.history = State.history.slice(0, idx);
                    State.solved = false;
                    document.getElementById('win-banner').classList.add('hidden');
                    if (State.history.length === 0) document.getElementById('undo-btn').disabled = true;
                    renderAll();
                };

                row.innerHTML = `
                    <div class="text-right pr-1">${renderSideToHTML(step.left)}</div>
                    <div class="text-center font-bold px-1">=</div>
                    <div class="text-left pl-1">${renderSideToHTML(step.right)}</div>
                `;
                container.appendChild(row);
            });

            // 2. Текущая живая строка внизу столбика
            const currentRow = document.createElement('div');
            currentRow.className = 'notebook-ink-grid pen-writing ink-current-row';

            let leftHTML = renderSideToHTML(State.left);
            let rightHTML = renderSideToHTML(State.right);

            if (State.livePreview && State.livePreview.type === 'drag') {
                const lp = State.livePreview;
                const highlight = lp.hoverTargetId ? [lp.termId, lp.hoverTargetId] : [];
                const fromArr = lp.fromSide === 'left' ? State.left : State.right;
                const filteredFrom = fromArr.filter(t => t.id !== lp.termId);

                if (lp.crossed) {
                    const movedVal = -lp.termObj.val;
                    const movedStr = `<span class="text-rose-600 font-bold">${formatHistoryTerm(movedVal, lp.termObj.isX, false)}</span>`;
                    if (lp.fromSide === 'left') {
                        leftHTML = renderSideToHTML(filteredFrom);
                        rightHTML = `${renderSideToHTML(State.right)} ${movedStr}`;
                    } else {
                        leftHTML = `${renderSideToHTML(State.left)} ${movedStr}`;
                        rightHTML = renderSideToHTML(filteredFrom);
                    }
                } else {
                    leftHTML = renderSideToHTML(State.left, highlight);
                    rightHTML = renderSideToHTML(State.right, highlight);
                }
            } else if (State.activeOp && State.activeOp.type === 'merge') {
                const op = State.activeOp;
                const typed = State.numpadBuffer === '' ? '?' : State.numpadBuffer.replace('.', ',');
                const previewChip = `<span class="text-amber-700 underline">${typed}${op.isX ? 'x' : ''}</span>`;
                const buildSide = (arr) => {
                    const rest = arr.filter(t => t.id !== op.sourceId && t.id !== op.targetId);
                    const base = rest.length > 0 ? renderSideToHTML(rest) + ' + ' : '';
                    return base + previewChip;
                };
                if (op.side === 'left') leftHTML = buildSide(State.left);
                else rightHTML = buildSide(State.right);
            } else if (State.activeOp && State.activeOp.type === 'divide') {
                const op = State.activeOp;
                const typed = State.numpadBuffer === '' ? `${formatRuNum(op.dividend)} : ${formatRuNum(op.divisor)}` : State.numpadBuffer.replace('.', ',');
                if (op.xSide === 'left') {
                    leftHTML = 'x';
                    rightHTML = `<span class="text-amber-700 underline">${typed}</span>`;
                } else {
                    leftHTML = `<span class="text-amber-700 underline">${typed}</span>`;
                    rightHTML = 'x';
                }
            }

            currentRow.innerHTML = `
                <div class="text-right pr-1">${leftHTML}</div>
                <div class="text-center font-bold px-1">=</div>
                <div class="text-left pl-1">${rightHTML}</div>
            `;
            container.appendChild(currentRow);
            container.scrollTop = container.scrollHeight;
        }

        /* =========================================================================
           4. РЕНДЕРИНГ ИГРОВОГО ПОЛЯ СЛАГАЕМЫХ И КАПСУЛ/ДРОБЕЙ
        ========================================================================= */
        function formatCoeffPart(val, isFirst) {
            let sign = '';
            if (val < 0) sign = isFirst ? '−' : '− ';
            else sign = isFirst ? '' : '+ ';
            let absNum = Math.abs(val);
            let numStr = absNum === 1 ? '' : formatRuNum(absNum);
            return `${sign}${numStr}`;
        }

        function formatNumberChip(val, isFirst) {
            let sign = '';
            if (val < 0) sign = isFirst ? '−' : '− ';
            else sign = isFirst ? '' : '+ ';
            return `${sign}${formatRuNum(Math.abs(val))}`;
        }

        function createTermDOM(term, sideName, isFirstOnSide) {
            const wrapper = document.createElement('div');
            const styleClass = term.val > 0 ? 'style-pos' : (term.val < 0 ? 'style-neg' : 'style-zero');
            wrapper.className = `term-unit ${styleClass}`;
            wrapper.dataset.id = term.id;
            wrapper.dataset.side = sideName;

            const divReady = isReadyForDivision();

            if (term.isX) {
                const coeffEl = document.createElement('div');
                const isCoeffReady = divReady && divReady.xSide === sideName && term.val !== 1;
                coeffEl.className = `coeff-part ${isCoeffReady ? 'coeff-ready' : ''}`;
                coeffEl.innerText = formatCoeffPart(term.val, isFirstOnSide);
                coeffEl.dataset.part = 'coeff';

                const varEl = document.createElement('div');
                varEl.className = 'var-part';
                varEl.innerText = 'x';
                varEl.dataset.part = 'var';

                if (!State.solved && !State.activeOp) {
                    coeffEl.addEventListener('pointerdown', (e) => onCoeffPointerDown(e, wrapper, term, sideName));
                    varEl.addEventListener('pointerdown', (e) => onWholeTermPointerDown(e, wrapper, term, sideName));
                }

                wrapper.appendChild(coeffEl);
                wrapper.appendChild(varEl);
            } else {
                const numEl = document.createElement('div');
                numEl.className = 'num-chip';
                numEl.innerText = formatNumberChip(term.val, isFirstOnSide);
                if (!State.solved && !State.activeOp) {
                    numEl.addEventListener('pointerdown', (e) => onWholeTermPointerDown(e, wrapper, term, sideName));
                }
                wrapper.appendChild(numEl);
            }

            return wrapper;
        }

        function renderSideInteractive(sideName, container) {
            container.innerHTML = '';
            const arr = State[sideName];

            // Если на этой стороне открыта капсула слияния
            if (State.activeOp && State.activeOp.type === 'merge' && State.activeOp.side === sideName) {
                const op = State.activeOp;
                let capsuleInserted = false;
                arr.forEach((term, idx) => {
                    if (term.id === op.sourceId || term.id === op.targetId) {
                        if (!capsuleInserted) {
                            capsuleInserted = true;
                            const cap = document.createElement('div');
                            cap.className = 'active-capsule math-font';
                            const t1 = formatHistoryTerm(op.val1, op.isX, true);
                            const t2 = formatHistoryTerm(op.val2, op.isX, false);
                            const typed = State.numpadBuffer === '' ? '?' : State.numpadBuffer.replace('.', ',');
                            cap.innerText = `${t1} ${t2} = ${typed}${op.isX ? 'x' : ''}`;
                            container.appendChild(cap);
                        }
                    } else {
                        container.appendChild(createTermDOM(term, sideName, idx === 0));
                    }
                });
                return;
            }

            // Если открыто финальное деление дробью
            if (State.activeOp && State.activeOp.type === 'divide') {
                const op = State.activeOp;
                if (sideName === op.xSide) {
                    container.appendChild(createTermDOM({ id: 'x_only', val: 1, isX: true }, sideName, true));
                    return;
                }
                if (sideName === op.numSide) {
                    const frac = document.createElement('div');
                    frac.className = 'active-fraction-box math-font';
                    frac.innerHTML = `
                        <span>${formatRuNum(op.dividend)}</span>
                        <div class="fraction-bar"></div>
                        <span>${formatRuNum(op.divisor)}</span>
                    `;
                    container.appendChild(frac);
                    return;
                }
            }

            arr.forEach((term, idx) => {
                container.appendChild(createTermDOM(term, sideName, idx === 0));
            });
        }

        function renderEquationStage() {
            const leftContainer = document.getElementById('left-side');
            const rightContainer = document.getElementById('right-side');

            renderSideInteractive('left', leftContainer);
            renderSideInteractive('right', rightContainer);

            checkWinCondition();
        }

        function renderAll() {
            renderNotebookTopSection();
            renderEquationStage();
        }

        /* =========================================================================
           5. ТАКТИЛЬНОЕ ПЕРЕТАСКИВАНИЕ (ПОРТАЛ И СЛИЯНИЕ С ПОДДЕРЖКОЙ СМАРТФОНОВ)
        ========================================================================= */
        let dragState = null;

        function findTargetTermNearPoint(x, y, excludeEl) {
            const directEl = document.elementFromPoint(x, y);
            const directUnit = directEl ? directEl.closest('.term-unit') : null;
            if (directUnit && directUnit !== excludeEl && directUnit.dataset.id) {
                return directUnit;
            }

            const allUnits = document.querySelectorAll('#equation-stage .term-unit');
            let bestUnit = null;
            let bestDist = 26;
            allUnits.forEach(u => {
                if (u === excludeEl || !u.dataset.id) return;
                const r = u.getBoundingClientRect();
                const dx = Math.max(r.left - x, 0, x - r.right);
                const dy = Math.max(r.top - y, 0, y - r.bottom);
                const dist = Math.hypot(dx, dy);
                if (dist < bestDist) {
                    bestDist = dist;
                    bestUnit = u;
                }
            });
            return bestUnit;
        }

        function onWholeTermPointerDown(e, unitEl, termObj, sideName) {
            if (State.activeOp || State.solved || dragState || coeffDragState) return;
            if (e.button !== undefined && e.button !== 0) return;

            e.preventDefault();
            e.stopPropagation();
            SoundEngine.pickup();

            try { unitEl.setPointerCapture(e.pointerId); } catch (err) {}
            const rect = unitEl.getBoundingClientRect();
            const portalRect = document.getElementById('portal-zone').getBoundingClientRect();
            const portalCenterX = portalRect.left + portalRect.width / 2;

            const touchLiftY = (e.pointerType === 'touch') ? 28 : 0;

            const floating = unitEl.cloneNode(true);
            floating.classList.add('dragging-clone');
            floating.style.minWidth = rect.width + 'px';
            floating.style.height = rect.height + 'px';
            document.body.appendChild(floating);

            unitEl.style.opacity = '0.22';

            dragState = {
                pointerId: e.pointerId,
                originEl: unitEl,
                floatingEl: floating,
                term: termObj,
                initialSide: sideName,
                shiftX: e.clientX - rect.left,
                shiftY: (e.clientY - rect.top) + touchLiftY,
                portalCenterX,
                crossed: false,
                hoverTargetEl: null,
                hoverTargetData: null,
                incompatibleEl: null
            };

            State.livePreview = {
                type: 'drag',
                termId: termObj.id,
                termObj: termObj,
                fromSide: sideName,
                crossed: false,
                hoverTargetId: null
            };
            renderNotebookTopSection();

            updateWholeTermPosition(e.clientX, e.clientY);

            unitEl.addEventListener('pointermove', onWholeTermPointerMove);
            unitEl.addEventListener('pointerup', onWholeTermPointerUp);
            unitEl.addEventListener('pointercancel', onWholeTermPointerUp);
        }

        function updateFloatingVisualSign(floatingEl, val, isX) {
            floatingEl.classList.remove('style-pos', 'style-neg');
            void floatingEl.offsetWidth;
            floatingEl.classList.add(val >= 0 ? 'style-pos' : 'style-neg');

            const signPrefix = val >= 0 ? '+' : '−';
            const absNum = Math.abs(val);
            const absStr = (isX && absNum === 1) ? '' : formatRuNum(absNum);
            if (isX) {
                const cPart = floatingEl.querySelector('.coeff-part');
                if (cPart) cPart.innerText = `${signPrefix}${absStr}`;
            } else {
                const nPart = floatingEl.querySelector('.num-chip');
                if (nPart) nPart.innerText = `${signPrefix}${formatRuNum(absNum)}`;
            }
        }

        function updateWholeTermPosition(clientX, clientY) {
            if (!dragState) return;
            const portalRect = document.getElementById('portal-zone').getBoundingClientRect();
            const portalX = portalRect.left + portalRect.width / 2;
            dragState.portalCenterX = portalX;

            const dist = clientX - portalX;
            const absDist = Math.abs(dist);

            let renderX = clientX;
            const membrane = document.getElementById('portal-membrane');
            const eqSign = document.getElementById('equals-sign');

            if (absDist < 38) {
                renderX = portalX + dist * 0.42;
                const bendX = 30 + (dist * 0.65);
                membrane.setAttribute('d', `M 30 8 Q ${bendX} 56 30 104`);
                eqSign.style.transform = 'scale(1.15)';
            } else {
                membrane.setAttribute('d', 'M 30 8 Q 30 56 30 104');
                eqSign.style.transform = 'scale(1)';
            }

            const nowCrossed = (dragState.initialSide === 'left' && clientX > portalX + 10) ||
                               (dragState.initialSide === 'right' && clientX < portalX - 10);

            if (nowCrossed !== dragState.crossed) {
                dragState.crossed = nowCrossed;
                const newVal = dragState.crossed ? -dragState.term.val : dragState.term.val;
                updateFloatingVisualSign(dragState.floatingEl, newVal, dragState.term.isX);

                SoundEngine.portalSnap();
                FX.burst(portalX, clientY, newVal >= 0 ? ['#60a5fa', '#3b82f6', '#ffffff'] : ['#fb7185', '#e11d48', '#ffffff'], 18);
                if (navigator.vibrate) navigator.vibrate(30);
            }

            const clampedX = Math.max(8, Math.min(window.innerWidth - 50, renderX - dragState.shiftX));
            const clampedY = Math.max(8, Math.min(window.innerHeight - 50, clientY - dragState.shiftY));

            dragState.floatingEl.style.left = clampedX + 'px';
            dragState.floatingEl.style.top = clampedY + 'px';
        }

        function onWholeTermPointerMove(e) {
            if (!dragState || e.pointerId !== dragState.pointerId) return;
            updateWholeTermPosition(e.clientX, e.clientY);

            if (dragState.hoverTargetEl) {
                dragState.hoverTargetEl.classList.remove('merge-glow');
                dragState.hoverTargetEl = null;
                dragState.hoverTargetData = null;
            }
            if (dragState.incompatibleEl) {
                dragState.incompatibleEl.classList.remove('incompatible-glow');
                dragState.incompatibleEl = null;
            }

            if (!dragState.crossed) {
                const targetUnit = findTargetTermNearPoint(e.clientX, e.clientY, dragState.originEl);

                if (targetUnit && targetUnit.dataset.id) {
                    const targetSide = targetUnit.dataset.side;
                    if (targetSide === dragState.initialSide) {
                        const targetObj = State[targetSide].find(t => t.id === targetUnit.dataset.id);
                        if (targetObj) {
                            if (targetObj.isX === dragState.term.isX || (!targetObj.isX && targetObj.val === 0)) {
                                dragState.hoverTargetEl = targetUnit;
                                dragState.hoverTargetData = targetObj;
                                targetUnit.classList.add('merge-glow');
                            } else {
                                dragState.incompatibleEl = targetUnit;
                                targetUnit.classList.add('incompatible-glow');
                            }
                        }
                    }
                }
            }

            if (State.livePreview) {
                const hoveredId = dragState.hoverTargetData ? dragState.hoverTargetData.id : null;
                if (State.livePreview.crossed !== dragState.crossed || State.livePreview.hoverTargetId !== hoveredId) {
                    State.livePreview.crossed = dragState.crossed;
                    State.livePreview.hoverTargetId = hoveredId;
                    renderNotebookTopSection();
                }
            }
        }

        function onWholeTermPointerUp(e) {
            if (!dragState || e.pointerId !== dragState.pointerId) return;
            const st = dragState;
            dragState = null;
            State.livePreview = null;

            st.originEl.removeEventListener('pointermove', onWholeTermPointerMove);
            st.originEl.removeEventListener('pointerup', onWholeTermPointerUp);
            st.originEl.removeEventListener('pointercancel', onWholeTermPointerUp);
            try { st.originEl.releasePointerCapture(e.pointerId); } catch (err) {}

            document.getElementById('portal-membrane').setAttribute('d', 'M 30 8 Q 30 56 30 104');
            document.getElementById('equals-sign').style.transform = 'scale(1)';

            if (st.hoverTargetEl) st.hoverTargetEl.classList.remove('merge-glow');
            if (st.incompatibleEl) st.incompatibleEl.classList.remove('incompatible-glow');
            st.floatingEl.remove();

            // 1. Перенос через знак "="
            if (st.crossed) {
                // Не переносим одиночный ноль впустую
                if (State[st.initialSide].length === 1 && st.term.val === 0 && !st.term.isX) {
                    renderAll();
                    return;
                }

                saveUndoSnapshot();
                const targetSide = st.initialSide === 'left' ? 'right' : 'left';
                
                State[st.initialSide] = State[st.initialSide].filter(t => t.id !== st.term.id);
                if (State[st.initialSide].length === 0) {
                    State[st.initialSide].push(createTerm(0, false));
                }

                const transferred = createTerm(-st.term.val, st.term.isX);
                if (State[targetSide].length === 1 && State[targetSide][0].val === 0 && !State[targetSide][0].isX) {
                    State[targetSide] = [transferred];
                } else {
                    State[targetSide].push(transferred);
                }

                tickRogueStep(true);
                renderAll();
                return;
            }

            // 2. Несовместимые слагаемые
            if (st.incompatibleEl) {
                SoundEngine.boing();
                renderAll();
                return;
            }

            // 3. Слияние подобных слагаемых в капсулу (или мгновенный синтез по перку)
            if (st.hoverTargetData) {
                const sumVal = Number((st.hoverTargetData.val + st.term.val).toFixed(4));

                // Перк "Малый Синтез": если |ответ| <= 5, складываем мгновенно без калькулятора
                if (State.mode === 'rogue' && hasPerk('small_synth') && Math.abs(sumVal) <= 5) {
                    saveUndoSnapshot();
                    const targetSideArr = State[st.initialSide];
                    let newArr = [];
                    let inserted = false;
                    targetSideArr.forEach(t => {
                        if (t.id === st.term.id || t.id === st.hoverTargetData.id) {
                            if (!inserted) {
                                inserted = true;
                                if (Math.abs(sumVal) > 0.00001) {
                                    newArr.push(createTerm(sumVal, st.term.isX));
                                }
                            }
                        } else {
                            newArr.push(t);
                        }
                    });
                    if (newArr.length === 0) newArr.push(createTerm(0, false));
                    State[st.initialSide] = newArr;

                    SoundEngine.success();
                    spawnFloatingPopup('rogue-hero-card', '🔥 Авто!', 'text-amber-300');
                    tickRogueStep(false);
                    renderAll();
                    return;
                }

                const leftBefore = cloneSide(State.left);
                const rightBefore = cloneSide(State.right);

                State.activeOp = {
                    type: 'merge',
                    side: st.initialSide,
                    sourceId: st.term.id,
                    targetId: st.hoverTargetData.id,
                    val1: st.hoverTargetData.val,
                    val2: st.term.val,
                    isX: st.term.isX,
                    hadError: false,
                    leftBefore,
                    rightBefore
                };

                SoundEngine.capsuleLock();
                openNumpadForMerge();
                renderAll();
                return;
            }

            renderAll();
        }

        /* =========================================================================
           6. ПЕРЕТАСКИВАНИЕ КОЭФФИЦИЕНТА ДЛЯ ДЕЛЕНИЯ
        ========================================================================= */
        let coeffDragState = null;

        function onCoeffPointerDown(e, unitEl, termObj, sideName) {
            if (State.activeOp || State.solved || dragState || coeffDragState) return;
            if (e.button !== undefined && e.button !== 0) return;

            const divInfo = isReadyForDivision();
            if (!divInfo || divInfo.xSide !== sideName || termObj.val === 1) {
                onWholeTermPointerDown(e, unitEl, termObj, sideName);
                return;
            }

            e.preventDefault();
            e.stopPropagation();
            SoundEngine.pickup();

            const coeffEl = e.currentTarget;
            try { coeffEl.setPointerCapture(e.pointerId); } catch (err) {}
            const rect = coeffEl.getBoundingClientRect();
            const touchLiftY = (e.pointerType === 'touch') ? 28 : 0;

            const floating = document.createElement('div');
            const styleClass = termObj.val < 0 ? 'style-neg' : 'style-pos';
            floating.className = `term-unit ${styleClass} dragging-clone`;
            floating.style.padding = '8px 16px';
            floating.innerText = formatRuNum(termObj.val);
            document.body.appendChild(floating);

            coeffEl.style.opacity = '0.2';

            const targetSideEl = document.getElementById(`${divInfo.numSide}-side`);
            const targetNumUnit = targetSideEl.querySelector('.term-unit');

            coeffDragState = {
                pointerId: e.pointerId,
                coeffEl,
                floatingEl: floating,
                divInfo,
                targetNumUnit,
                shiftX: e.clientX - rect.left,
                shiftY: (e.clientY - rect.top) + touchLiftY,
                overFractionZone: false
            };

            moveCoeffClone(e.clientX, e.clientY);

            coeffEl.addEventListener('pointermove', onCoeffPointerMove);
            coeffEl.addEventListener('pointerup', onCoeffPointerUp);
            coeffEl.addEventListener('pointercancel', onCoeffPointerUp);
        }

        function moveCoeffClone(clientX, clientY) {
            if (!coeffDragState) return;
            const clampedX = Math.max(8, Math.min(window.innerWidth - 50, clientX - coeffDragState.shiftX));
            const clampedY = Math.max(8, Math.min(window.innerHeight - 50, clientY - coeffDragState.shiftY));
            coeffDragState.floatingEl.style.left = clampedX + 'px';
            coeffDragState.floatingEl.style.top = clampedY + 'px';
        }

        function onCoeffPointerMove(e) {
            if (!coeffDragState || e.pointerId !== coeffDragState.pointerId) return;
            moveCoeffClone(e.clientX, e.clientY);

            if (coeffDragState.targetNumUnit) {
                const r = coeffDragState.targetNumUnit.getBoundingClientRect();
                const inHoriz = e.clientX >= r.left - 58 && e.clientX <= r.right + 58;
                const inVert = e.clientY >= r.top - 45 && e.clientY <= r.bottom + 105;

                if (inHoriz && inVert) {
                    coeffDragState.overFractionZone = true;
                    coeffDragState.targetNumUnit.style.transform = 'translateY(-10px) scale(1.06)';
                    coeffDragState.targetNumUnit.classList.add('merge-glow');
                } else {
                    coeffDragState.overFractionZone = false;
                    coeffDragState.targetNumUnit.style.transform = '';
                    coeffDragState.targetNumUnit.classList.remove('merge-glow');
                }
            }
        }

        function onCoeffPointerUp(e) {
            if (!coeffDragState || e.pointerId !== coeffDragState.pointerId) return;
            const cd = coeffDragState;
            coeffDragState = null;

            cd.coeffEl.removeEventListener('pointermove', onCoeffPointerMove);
            cd.coeffEl.removeEventListener('pointerup', onCoeffPointerUp);
            cd.coeffEl.removeEventListener('pointercancel', onCoeffPointerUp);
            try { cd.coeffEl.releasePointerCapture(e.pointerId); } catch (err) {}
            cd.floatingEl.remove();

            if (cd.targetNumUnit) {
                cd.targetNumUnit.style.transform = '';
                cd.targetNumUnit.classList.remove('merge-glow');
            }

            if (cd.overFractionZone) {
                const dividend = cd.divInfo.numTerm.val;
                const divisor = cd.divInfo.xTerm.val;
                const quotient = Number((dividend / divisor).toFixed(4));

                // Перк "Снайпер-Делитель": если делится нацело, делим мгновенно без калькулятора
                if (State.mode === 'rogue' && hasPerk('sniper_div') && Number.isInteger(quotient)) {
                    saveUndoSnapshot();
                    State[cd.divInfo.xSide] = [createTerm(1, true)];
                    State[cd.divInfo.numSide] = [createTerm(quotient, false)];
                    SoundEngine.success();
                    spawnFloatingPopup('rogue-hero-card', '🎯 Авто!', 'text-amber-300');
                    tickRogueStep(false);
                    renderAll();
                    return;
                }

                const leftBefore = cloneSide(State.left);
                const rightBefore = cloneSide(State.right);

                State.activeOp = {
                    type: 'divide',
                    xSide: cd.divInfo.xSide,
                    numSide: cd.divInfo.numSide,
                    dividend,
                    divisor,
                    hadError: false,
                    leftBefore,
                    rightBefore
                };

                SoundEngine.capsuleLock();
                openNumpadForDivision();
                renderAll();
                return;
            }

            renderAll();
        }

        /* =========================================================================
           7. ИГРОВОЙ NUMPAD С ЗАПЯТОЙ И ПОДДЕРЖКОЙ КЛАВИАТУРЫ
        ========================================================================= */
        function openNumpadForMerge() {
            const op = State.activeOp;
            State.numpadBuffer = '';
            const t1 = formatHistoryTerm(op.val1, op.isX, true);
            const t2 = formatHistoryTerm(op.val2, op.isX, false);
            document.getElementById('numpad-formula').innerText = `${t1} ${t2} =`;
            document.getElementById('numpad-value').innerText = '?';
            const unitEl = document.getElementById('numpad-x-unit');
            if (op.isX) unitEl.classList.remove('hidden');
            else unitEl.classList.add('hidden');

            document.body.classList.add('numpad-open');
            document.getElementById('numpad-drawer').classList.remove('translate-y-full');
        }

        function openNumpadForDivision() {
            const op = State.activeOp;
            State.numpadBuffer = '';
            const divStr = op.divisor < 0 ? `(${formatRuNum(op.divisor)})` : `${formatRuNum(op.divisor)}`;
            document.getElementById('numpad-formula').innerText = `${formatRuNum(op.dividend)} / ${divStr} =`;
            document.getElementById('numpad-value').innerText = '?';
            document.getElementById('numpad-x-unit').classList.add('hidden');

            document.body.classList.add('numpad-open');
            document.getElementById('numpad-drawer').classList.remove('translate-y-full');
        }

        function closeNumpadDrawer() {
            document.body.classList.remove('numpad-open');
            document.getElementById('numpad-drawer').classList.add('translate-y-full');
        }

        function cancelActiveOperation() {
            if (State.activeOp) {
                State.left = State.activeOp.leftBefore;
                State.right = State.activeOp.rightBefore;
                State.activeOp = null;
            }
            closeNumpadDrawer();
            renderAll();
        }

        function pressNumpad(char) {
            if (!State.activeOp) return;
            if (char === 'BACK') {
                State.numpadBuffer = State.numpadBuffer.slice(0, -1);
            } else if (char === '-') {
                if (State.numpadBuffer.startsWith('-')) State.numpadBuffer = State.numpadBuffer.slice(1);
                else State.numpadBuffer = '-' + State.numpadBuffer;
            } else if (char === ',') {
                if (!State.numpadBuffer.includes('.')) {
                    if (State.numpadBuffer === '' || State.numpadBuffer === '-') {
                        State.numpadBuffer += '0.';
                    } else {
                        State.numpadBuffer += '.';
                    }
                }
            } else if (State.numpadBuffer.length < 8) {
                State.numpadBuffer += char;
            }

            const disp = State.numpadBuffer === '' ? '?' : State.numpadBuffer.replace('.', ',');
            document.getElementById('numpad-value').innerText = disp;
            renderAll();
        }

        function submitNumpad() {
            if (!State.activeOp || State.numpadBuffer === '' || State.numpadBuffer === '-') return;
            const userNum = parseFloat(State.numpadBuffer);
            if (isNaN(userNum)) return;

            const op = State.activeOp;
            let correctNum = 0;

            if (op.type === 'merge') {
                correctNum = op.val1 + op.val2;
            } else if (op.type === 'divide') {
                correctNum = op.dividend / op.divisor;
            }

            if (Math.abs(userNum - correctNum) < 0.0001) {
                SoundEngine.success();
                closeNumpadDrawer();

                State.history.push({
                    left: cloneSide(op.leftBefore),
                    right: cloneSide(op.rightBefore)
                });
                document.getElementById('undo-btn').disabled = false;

                if (op.type === 'merge') {
                    const targetSideArr = State[op.side];
                    let newArr = [];
                    let inserted = false;
                    targetSideArr.forEach(t => {
                        if (t.id === op.sourceId || t.id === op.targetId) {
                            if (!inserted) {
                                inserted = true;
                                if (Math.abs(correctNum) > 0.00001) {
                                    newArr.push(createTerm(correctNum, op.isX));
                                }
                            }
                        } else {
                            newArr.push(t);
                        }
                    });
                    if (newArr.length === 0) {
                        newArr.push(createTerm(0, false));
                    }
                    State[op.side] = newArr;
                } else if (op.type === 'divide') {
                    State[op.xSide] = [createTerm(1, true)];
                    State[op.numSide] = [createTerm(Number(correctNum.toFixed(4)), false)];
                }

                // Перк "Инерция Ума": если посчитано верно с 1-й попытки, откатываем таймер врага на +1⏳
                if (State.mode === 'rogue' && hasPerk('inertia') && !op.hadError && State.rogue.enemy) {
                    State.rogue.enemy.timer += 1;
                    spawnFloatingPopup('rogue-enemy-card', '⚡ +1⏳', 'text-amber-300');
                }

                State.activeOp = null;
                tickRogueStep(false);
                renderAll();
            } else {
                SoundEngine.boing();
                op.hadError = true;
                if (State.mode === 'rogue') {
                    State.rogue.hadErrorThisWave = true;
                    const died = damageHero(1, 'Ошибка!');
                    if (died) {
                        closeNumpadDrawer();
                        return;
                    }
                }
                const valEl = document.getElementById('numpad-value');
                valEl.classList.add('text-rose-500');
                setTimeout(() => valEl.classList.remove('text-rose-500'), 350);
            }
        }

        // Поддержка ввода с физической клавиатуры
        window.addEventListener('keydown', (e) => {
            if (!State.activeOp) return;
            if (e.key >= '0' && e.key <= '9') {
                pressNumpad(e.key);
            } else if (e.key === '-' || e.key === '_') {
                pressNumpad('-');
            } else if (e.key === ',' || e.key === '.') {
                pressNumpad(',');
            } else if (e.key === 'Backspace') {
                pressNumpad('BACK');
            } else if (e.key === 'Enter') {
                e.preventDefault();
                submitNumpad();
            } else if (e.key === 'Escape') {
                cancelActiveOperation();
            }
        });

        /* =========================================================================
           8. МОДАЛКА КОНСТРУКТОРА СВОИХ ПРИМЕРОВ
        ========================================================================= */
        function openCustomModal() {
            document.getElementById('custom-error').classList.add('hidden');
            document.getElementById('custom-modal').classList.remove('hidden');
        }

        function closeCustomModal() {
            document.getElementById('custom-modal').classList.add('hidden');
        }

        function parseEquationSide(str) {
            const clean = str
                .replace(/\s+/g, '')
                .replace(/−/g, '-')
                .replace(/,/g, '.')
                .replace(/\+-/g, '-')
                .replace(/-\+/g, '-')
                .replace(/--/g, '+');
            if (!clean) return null;
            const tokens = clean.match(/[+-]?[^+-]+/g) || [];
            const res = [];

            for (let tok of tokens) {
                let isX = tok.includes('x') || tok.includes('X') || tok.includes('х') || tok.includes('Х');
                let numPart = tok.replace(/[xXхХ]/g, '');
                let val = 1;
                if (numPart === '' || numPart === '+') val = 1;
                else if (numPart === '-') val = -1;
                else {
                    val = parseFloat(numPart);
                    if (isNaN(val)) return null;
                }
                res.push(createTerm(val, isX));
            }
            return res;
        }

        function applyCustomEquation() {
            const lStr = document.getElementById('custom-left-input').value;
            const rStr = document.getElementById('custom-right-input').value;

            const lParsed = parseEquationSide(lStr);
            const rParsed = parseEquationSide(rStr);

            if (!lParsed || !rParsed || lParsed.length === 0 || rParsed.length === 0) {
                document.getElementById('custom-error').classList.remove('hidden');
                return;
            }

            State.mode = 'custom';
            ['lvl1', 'lvl2', 'dec', 'hard', 'custom'].forEach(m => {
                const btn = document.getElementById('mode-' + m);
                if (btn) btn.classList.toggle('active', m === 'custom');
            });

            State.left = lParsed;
            State.right = rParsed;
            State.history = [];
            State.solved = false;
            State.activeOp = null;
            document.getElementById('undo-btn').disabled = true;
            document.getElementById('win-banner').classList.add('hidden');
            closeCustomModal();
            renderAll();
        }

        window.addEventListener('blur', () => {
            if (dragState) {
                dragState.floatingEl.remove();
                dragState = null;
                State.livePreview = null;
                renderAll();
            }
            if (coeffDragState) {
                coeffDragState.floatingEl.remove();
                coeffDragState = null;
                State.livePreview = null;
                renderAll();
            }
        });

        window.onload = () => {
            FX.init();
            startNewEquation();
        };
    </script>
</body>
